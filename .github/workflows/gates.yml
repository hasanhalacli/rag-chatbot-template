name: gates
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # full history, so the secret scan covers every commit ever made

      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzf - gitleaks
          ./gitleaks detect --source . --no-banner --redact

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.13"
          python-version: "3.12"

      - name: Exact versions only
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib
          p = tomllib.load(open("pyproject.toml", "rb"))
          groups = {"build-system.requires": p["build-system"]["requires"], "dependencies": p["project"]["dependencies"]}
          groups.update({f"optional.{k}": v for k, v in p["project"].get("optional-dependencies", {}).items() if k != "all"})
          exact = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*(\[[A-Za-z0-9._,-]+\])?==\d[0-9A-Za-z.+!-]*$")
          bad = [f"{g}: {d}" for g, ds in groups.items() for d in ds if not exact.match(d.replace(" ", ""))]
          print("\n".join(bad) if bad else f"{sum(len(v) for v in groups.values())} dependencies, all pinned exactly")
          sys.exit(1 if bad else 0)
          EOF

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Known-vulnerability audit (runtime and dev)
        run: |
          uv export --no-hashes --all-extras --no-emit-project -o /tmp/reqs.txt
          # Linux resolves torch from PyTorch's CPU index as 2.13.0+cpu; advisories are filed
          # against the PyPI release, so audit that version.
          sed -i -E 's/\+cpu\b//' /tmp/reqs.txt
          uvx pip-audit==2.10.1 --no-deps -r /tmp/reqs.txt

      - name: Tests
        run: |
          uv sync --extra dev
          uv run pytest -q

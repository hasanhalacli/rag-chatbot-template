[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-template"
version = "0.1.0"
description = "Production-ready RAG chatbot without LangChain/LlamaIndex"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Hasan Halacli", email = "hasan@halacli.com"}
]
keywords = ["rag", "chatbot", "llm", "qdrant", "retrieval", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "qdrant-client==1.19.0",
    "sentence-transformers==6.0.1",
    "torch==2.13.0",
    "openai==3.7.0",
    "anthropic==1.7.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.3.1",
    "ruff==0.16.5",
]
rerank = [
    "sentence-transformers==6.0.1",
]
all = [
    "rag-chatbot-template[dev,rerank]",
]

[project.urls]
Homepage = "https://github.com/hasanhalacli/rag-chatbot-template"
Repository = "https://github.com/hasanhalacli/rag-chatbot-template"
Issues = "https://github.com/hasanhalacli/rag-chatbot-template/issues"


[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI and Linux users get CPU-only torch (≈200 MB) instead of the CUDA build (≈2.7 GB); macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-template"
version = "0.1.0"
description = "Production-ready RAG chatbot without LangChain/LlamaIndex"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Hasan Halacli", email = "hasan@halacli.com"}
]
keywords = ["rag", "chatbot", "llm", "qdrant", "retrieval", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "qdrant-client==1.19.0",
    "sentence-transformers==6.0.1",
    "openai==3.7.0",
    "anthropic==1.3.0",
    "httpx==0.28.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pypdf==6.16.2",
    "python-multipart==0.0.32",
    "tiktoken==0.14.0",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.3.1",
    "ruff==0.16.5",
]
rerank = [
    "sentence-transformers==6.0.1",
]
all = [
    "rag-chatbot-template[dev,rerank]",
]

[project.urls]
Homepage = "https://github.com/hasanhalacli/rag-chatbot-template"
Repository = "https://github.com/hasanhalacli/rag-chatbot-template"
Issues = "https://github.com/hasanhalacli/rag-chatbot-template/issues"


[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
